name: uboot-an758x-pbs05

on:
  workflow_dispatch:

#同一平台同时只跑一个构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

#CI权限：发布 Release、清理旧运行记录需要写权限
permissions:
  contents: write
  actions: write

#CI任务
jobs:
  uboot_config:
    #调用公用编译核心 Uboot-CORE.yml
    uses: ./.github/workflows/Uboot-CORE.yml
    secrets: inherit
    with:
      #平台标识（Release tag / 产物前缀）
      UBOOT_TARGET: uboot-an758x-pbs05
      UBOOT_URL: https://github.com/pbs05/uboot-an758x.git
      UBOOT_BRANCH: main
      #构建脚本（源码内路径）
      UBOOT_SCRIPT: scripts/build-an758x.sh
      #机型名单（每次读取 txt，自动同步上游新机型）
      UBOOT_BOARDS_FILE: Config/uboot-an758x-boards.txt
