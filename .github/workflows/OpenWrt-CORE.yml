name: OpenWrt-CORE

on:
  workflow_call:
    inputs:
      # ---------------- 必填 ----------------
      OpenWrt_TARGET:
        required: true
        type: string
        description: '平台标识，对应 Config/<TARGET>.txt'
      OpenWrt_THEME:
        required: true
        type: string
        description: '默认主题（argon / design 等）'
      OpenWrt_NAME:
        required: true
        type: string
        description: '默认主机名'
      OpenWrt_URL:
        required: true
        type: string
        description: '源码仓库地址'
      OpenWrt_BRANCH:
        required: true
        type: string
        description: '源码分支'
      OpenWrt_PW:
        required: true
        type: string
        description: '默认密码（仅发布说明展示）'
      OpenWrt_IP:
        required: true
        type: string
        description: '默认管理地址'
      # ---------------- 选填 ----------------
      OpenWrt_CONFIG:
        required: false
        type: string
        default: ''
        description: '自定义配置文件（相对仓库根路径），留空则用 Config/<TARGET>.txt'
      OpenWrt_CACHE:
        required: false
        type: string
        default: 'true'
        description: "是否启用工具链缓存，'false' 表示关闭"
      OpenWrt_OPENCLASH:
        required: false
        type: string
        default: 'false'
        description: "是否编译 luci-app-openclash，'true' 表示编译（默认关闭）"
      OpenWrt_NIKKI:
        required: false
        type: string
        default: 'false'
        description: "是否编译 luci-app-nikki，'true' 表示编译（默认关闭）"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # runner 只有一个盘，构建目录就放在工作区里
  OPENWRT_DIR: ${{ github.workspace }}/openwrt

  OpenWrt_TARGET: ${{ inputs.OpenWrt_TARGET }}
  OpenWrt_THEME: ${{ inputs.OpenWrt_THEME }}
  OpenWrt_NAME: ${{ inputs.OpenWrt_NAME }}
  OpenWrt_URL: ${{ inputs.OpenWrt_URL }}
  OpenWrt_BRANCH: ${{ inputs.OpenWrt_BRANCH }}
  OpenWrt_PW: ${{ inputs.OpenWrt_PW }}
  OpenWrt_IP: ${{ inputs.OpenWrt_IP }}
  OpenWrt_CONFIG: ${{ inputs.OpenWrt_CONFIG }}
  OpenWrt_CACHE: ${{ inputs.OpenWrt_CACHE }}
  OpenWrt_OPENCLASH: ${{ inputs.OpenWrt_OPENCLASH }}
  OpenWrt_NIKKI: ${{ inputs.OpenWrt_NIKKI }}

jobs:
  openwrt_core:
    name: Build ${{ inputs.OpenWrt_TARGET }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      cache_prefix: ${{ steps.cache_key.outputs.prefix }}
      cache_key: ${{ steps.cache_key.outputs.key }}

    steps:
      # =======================================================================
      # 1. 拉取 CI 仓库（Config / Scripts）
      # =======================================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # =======================================================================
      # 2. 释放磁盘 + Swap + 安装依赖
      # =======================================================================
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "::group::清理预装大体积软件"
          # 保留 /opt/hostedtoolcache：runner 的 Go 在这里，构建主机优化要用
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm \
            /usr/share/swift /usr/local/.ghcup /opt/google/chrome \
            /usr/local/share/chromium /usr/share/gradle || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "::endgroup::"

          echo "::group::配置 16G Swap"
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile \
            || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -h
          echo "::endgroup::"

          echo "::group::安装依赖"
          sudo apt-get -yqq purge firefox
          sudo apt-get -yqq update
          sudo apt-get -yqq full-upgrade
          sudo apt-get -yqq autoremove --purge
          sudo apt-get -yqq autoclean
          sudo apt-get -yqq clean

          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd


          sudo timedatectl set-timezone "$TZ"
          echo "::endgroup::"

          echo "工具链版本："
          gcc --version | head -n1 || true
          make --version | head -n1 || true
          echo "磁盘（只有一个盘：系统盘 = 构建盘）："
          df -hT /
          echo "CPU 核数: $(nproc)"

      # =======================================================================
      # 3. 生成日期 / 源码名 / 设备名等变量
      # =======================================================================
      - name: Initialization Values
        run: |
          # 源码名：取 URL 最后一段并去掉 .git
          OpenWrt_SOURCE="$(basename "$OpenWrt_URL")"
          OpenWrt_SOURCE="${OpenWrt_SOURCE%.git}"

          # 配置文件：优先用调用方传入的 OpenWrt_CONFIG
          CONF="${OpenWrt_CONFIG:-Config/$OpenWrt_TARGET.txt}"
          CONF_ABS="$GITHUB_WORKSPACE/$CONF"

          # 设备名：取配置首行注释（# 后面的内容）
          if [ -s "$CONF_ABS" ]; then
            OpenWrt_TYPE="$(sed -n '1{s/^#[[:space:]]*//;s/\r$//;p;q}' "$CONF_ABS")"
          else
            OpenWrt_TYPE="$OpenWrt_TARGET"
          fi

          # 时间：固定东八区，避免 runner 默认 UTC 造成发布标签错位
          OpenWrt_DATE="$(TZ=UTC-8 date +'%y.%m.%d_%H.%M.%S')"

          {
            echo "OpenWrt_SOURCE=$OpenWrt_SOURCE"
            echo "OpenWrt_TARGET=$OpenWrt_TARGET"
            echo "OpenWrt_DATE=$OpenWrt_DATE"
            echo "OpenWrt_TYPE=$OpenWrt_TYPE"
            echo "OpenWrt_CONFIG_FILE=$CONF"
          } >> "$GITHUB_ENV"

          {
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 平台 | \`$OpenWrt_TARGET\` |"
            echo "| 设备 | \`$OpenWrt_TYPE\` |"
            echo "| 配置 | \`$CONF\` |"
            echo "| 源码 | $OpenWrt_URL ($OpenWrt_BRANCH) |"
            echo "| 时间 | $OpenWrt_DATE |"
          } >> "$GITHUB_STEP_SUMMARY"

      # =======================================================================
      # 4. 脚本自检（统一换行符 + 语法检查）
      # =======================================================================
      - name: Check Scripts
        run: |
          for dir in "$GITHUB_WORKSPACE/Scripts" "$GITHUB_WORKSPACE/.github/scripts"; do
            [ -d "$dir" ] || continue
            cd "$dir"
            chmod +x ./*.sh 2>/dev/null || true
            if command -v dos2unix >/dev/null 2>&1; then
              dos2unix ./*.sh >/dev/null 2>&1 || true
            fi
            for f in ./*.sh; do
              bash -n "$f" || echo "::warning::$f 语法检查未通过（仍会继续执行）"
            done
          done

      # =======================================================================
      # 5. 克隆源码
      # =======================================================================
      - name: Clone OpenWrt Code
        run: |
          git clone --depth=1 --single-branch --branch "$OpenWrt_BRANCH" "$OpenWrt_URL" "$OPENWRT_DIR"
          cd "$OPENWRT_DIR"

          # GitHub runner 访问国内镜像通常很慢甚至超时，移除后走上游官方源
          MIRRORS="./scripts/projectsmirrors.json"
          if [ -f "$MIRRORS" ]; then
            sed -i '/\.cn\//d; /tencent/d; /aliyun/d' "$MIRRORS" || true
            echo "已移除源码内的国内下载镜像"
          fi

          # 发布用的「提交」信息一律取自源码仓库（OpenWrt_URL），不是本 CI 仓库
          COMMIT_FULL="$(git rev-parse HEAD)"
          COMMIT_SHORT="$(git rev-parse --short HEAD)"
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          # 源码提交的可点击链接（去掉 URL 末尾的 .git）
          COMMIT_URL="${OpenWrt_URL%.git}/commit/${COMMIT_FULL}"

          {
            echo "OpenWrt_COMMIT=$COMMIT_SHORT"
            echo "OpenWrt_COMMIT_FULL=$COMMIT_FULL"
            echo "OpenWrt_COMMIT_MSG=$COMMIT_MSG"
            echo "OpenWrt_COMMIT_URL=$COMMIT_URL"
          } >> "$GITHUB_ENV"

          git log -1 --format='源码提交: %h %s'
          echo "源码提交链接: $COMMIT_URL"
          df -hT "$PWD"

      # =======================================================================
      # 6. 应用平台补丁
      #     Patches/<平台>/ 下所有 *.patch / *.diff 按文件名排序。
      #     兼容 git diff 和 git format-patch：优先 git apply（支持二进制、
      #     文件重命名等 git 扩展），失败时回退 patch -p1（兼容普通 unified diff）。
      # =======================================================================
      - name: Apply Platform Patches
        run: |
          cd "$OPENWRT_DIR"
          PATCH_DIR="$GITHUB_WORKSPACE/Patches/$OpenWrt_TARGET"
          if [ ! -d "$PATCH_DIR" ]; then
            echo "平台 $OpenWrt_TARGET 无补丁目录，跳过"
            exit 0
          fi
          if ! find "$PATCH_DIR" -type f \( -name '*.patch' -o -name '*.diff' \) -print -quit | grep -q .; then
            echo "平台 $OpenWrt_TARGET 补丁目录为空，跳过"
            exit 0
          fi
          PATCH_COUNT=0
          while IFS= read -r -d '' p; do
            echo "应用补丁: ${p#"$GITHUB_WORKSPACE"/}"
            if ! grep -qE '^(diff --git |--- |@@ |Index: )' "$p"; then
              echo "  无 diff 内容，跳过"
              continue
            fi
            if git apply "$p"; then
              echo "  已用 git apply 应用"
            elif patch -p1 --batch --no-backup-if-mismatch < "$p"; then
              echo "  已用 patch -p1 应用"
            else
              echo "::error::补丁应用失败: $p"
              exit 1
            fi
            PATCH_COUNT=$((PATCH_COUNT + 1))
          done < <(find "$PATCH_DIR" -type f \( -name '*.patch' -o -name '*.diff' \) -print0 | sort -z)
          echo "共应用 $PATCH_COUNT 个补丁"

      # =======================================================================
      # 7. Feeds 更新 + 自定义脚本
      #    Settings.sh 必须在 feeds install 之前跑（它改的是 feeds 里的默认主题）
      # =======================================================================
      - name: Update Feeds & Custom Scripts
        run: |
          cd "$OPENWRT_DIR"
          ./scripts/feeds update -a

          "$GITHUB_WORKSPACE/Scripts/Settings.sh"

          cd ./package
          "$GITHUB_WORKSPACE/Scripts/Plugins.sh"
          cd ..

          ./scripts/feeds install -a

      # =======================================================================
      # 8. 生成 .config
      #    每个平台只需要一个文件：Config/<TARGET>.txt
      #      a. 首行写 `#设备名`（发布说明用）
      #      b. 写 `#!DEFCONFIG=configs/xxx.config` → 先加载源码自带完整配置
      #      c. 文件其余内容作为额外配置追加到末尾（后写覆盖先写）
      #      d. defconfig 前接构建主机优化（Go bootstrap / 关 host PGO / 统一 BPF LLVM）
      #      e. defconfig 后 make clean，清掉旧产物，保证缓存工具链干净复用
      # =======================================================================
      - name: Prepare Config
        run: |
          cd "$OPENWRT_DIR"
          rm -rf ./tmp ./.config ./.config.old

          CFG="$GITHUB_WORKSPACE/$OpenWrt_CONFIG_FILE"
          if [ ! -s "$CFG" ]; then
            echo "::error::找不到配置文件: $CFG"
            exit 1
          fi

          DEFCONFIG="$(sed -n 's/^#!DEFCONFIG=[[:space:]]*//p' "$CFG" | head -n1 | tr -d '\r' | sed 's/[[:space:]]*$//')"

          # 防呆：DEFCONFIG 行少了 "#!" 前缀会被原样追加进 .config，
          # 导致平台识别错乱（例如落到默认的 mediatek 而不是 airoha）
          if grep -q '^DEFCONFIG=' "$CFG"; then
            echo "::error::配置文件里的 DEFCONFIG 必须写成 #!DEFCONFIG=（少了 #! 前缀）: $CFG"
            exit 1
          fi

          if [ -n "$DEFCONFIG" ]; then
            if [ ! -s "$DEFCONFIG" ]; then
              echo "::error::需要源码自带配置 $DEFCONFIG，但源码里不存在"
              exit 1
            fi
            echo "使用源码自带配置: $DEFCONFIG"
            cat "$DEFCONFIG" > .config
          else
            echo "使用 CI 仓库配置: $OpenWrt_CONFIG_FILE"
            : > .config
          fi

          # 配置文件其余内容 = 该平台的额外配置
          echo "追加额外配置: $OpenWrt_CONFIG_FILE"
          grep -v '^#!DEFCONFIG=' "$CFG" >> .config || true

          # OpenClash 运行时开关：写在配置文件之后，覆盖同名项（后写覆盖先写）
          if [ "$OpenWrt_OPENCLASH" = "true" ]; then
            echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
            echo "[OpenClash] 本次构建：启用"
          else
            echo "CONFIG_PACKAGE_luci-app-openclash=n" >> .config
            echo "[OpenClash] 本次构建：关闭"
          fi

          # Nikki 运行时开关：三个子包由 Plugins.sh 克隆到 package/，这里只控制是否选中
          if [ "$OpenWrt_NIKKI" = "true" ]; then
            echo "CONFIG_PACKAGE_luci-app-nikki=y" >> .config
            echo "[Nikki] 本次构建：启用"
          else
            echo "CONFIG_PACKAGE_luci-app-nikki=n" >> .config
            echo "[Nikki] 本次构建：关闭"
          fi

          # 用 runner 现成的 Go/LLVM 搭建 host 工具链（Go bootstrap、关 host Python PGO、统一 BPF LLVM）
          if command -v go >/dev/null 2>&1 && command -v llvm-config >/dev/null 2>&1; then
            "$GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh"
          else
            echo "::warning::go 或 llvm-config 不可用，跳过构建主机优化"
          fi

          make defconfig
          make clean -j"$(nproc)"

          if ! grep -q '^CONFIG_TARGET_BOARD=' .config; then
            echo "::error::.config 里没有目标平台（缺少 CONFIG_TARGET_*），请检查 $OpenWrt_CONFIG_FILE"
            exit 1
          fi

          echo "---- 目标平台 ----"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=' .config || true
          DEVICE_COUNT="$(grep -c '^CONFIG_TARGET_DEVICE_.*=y' .config || true)"
          echo "已选机型数量: ${DEVICE_COUNT:-0}"

          # 提示：rust 会编译整套 LLVM 工具链，慢且极占空间
          if grep -q '^CONFIG_PACKAGE_rust=y' .config; then
            echo "::warning::.config 启用了 rust（体积/耗时都很大），检查是否被 passwall 等组件带进来的"
            grep -E '^CONFIG_PACKAGE_(rust|shadowsocks-rust|luci-app-passwall)' .config || true
          fi

      # =======================================================================
      # 9. 准备 Rust 工具链
      #     RTL9617C 的 pon-control 含 Rust OMCI，Makefile 直接调 runner 的 cargo
      #     交叉编译；target triple 由 rust-values.mk 推导，不再写死架构。
      # =======================================================================
      - name: Prepare Rust Toolchain
        run: |
          cd "$OPENWRT_DIR"
          "$GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh"

      # =======================================================================
      # 10. 工具链缓存 Key（tools/ + toolchain/ 的 Makefile 内容哈希）
      # =======================================================================
      - name: Toolchain Cache Key
        id: cache_key
        if: inputs.OpenWrt_CACHE != 'false'
        run: |
          cd "$OPENWRT_DIR"
          BOARD="$(sed -n 's/^CONFIG_TARGET_BOARD="\(.*\)"/\1/p' .config | head -n1)"
          SUBTARGET="$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\(.*\)"/\1/p' .config | head -n1)"
          : "${BOARD:=unknown}"
          : "${SUBTARGET:=generic}"

          HASH="$(find tools toolchain -type f \( -name 'Makefile' -o -name '*.mk' \) \
            -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -c1-16)"

          # v3：单盘布局，构建目录回到工作区；旧缓存路径不同，换 key 避免误恢复
          KEY="toolchain-v3-${BOARD}-${SUBTARGET}-${HASH}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "prefix=toolchain-v3-${BOARD}-${SUBTARGET}" >> "$GITHUB_OUTPUT"
          echo "工具链缓存 Key: $KEY"

      # =======================================================================
      # 11. 恢复工具链（第一优先：actions/cache）
      # =======================================================================
      - name: Restore Toolchain (actions/cache)
        id: cache_restore
        if: inputs.OpenWrt_CACHE != 'false'
        uses: actions/cache/restore@v5
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*
          key: ${{ steps.cache_key.outputs.key }}

      # =======================================================================
      # 12. 恢复工具链（第二优先：Release 备份，精确匹配当前 Key）
      # =======================================================================
      - name: Restore Toolchain (Release backup)
        id: release_restore
        if: inputs.OpenWrt_CACHE != 'false' && steps.cache_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$OPENWRT_DIR"
          KEY="${{ steps.cache_key.outputs.key }}"
          ASSET="${KEY}.tzst"

          if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "toolchain-cache Release 不存在（首次运行属正常）"
            exit 0
          fi

          if gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets \
               -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
            echo "从 Release 下载工具链: $ASSET"
            gh release download toolchain-cache --repo "$GITHUB_REPOSITORY" -p "$ASSET" -D .
            if [ -s "$ASSET" ]; then
              tar -I unzstd -xf "$ASSET" 2>/dev/null || tar -xf "$ASSET"
              rm -f "$ASSET"
              echo "restored=true" >> "$GITHUB_OUTPUT"
              echo "Release 工具链恢复成功"
            else
              echo "restored=false" >> "$GITHUB_OUTPUT"
              echo "下载失败：$ASSET"
            fi
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Release 中没有当前缓存: $ASSET"
          fi

      # =======================================================================
      # 13. 下载软件包（在编译前，尽早暴露源码包 404 / 校验失败）
      # =======================================================================
      - name: Download Packages
        run: |
          cd "$OPENWRT_DIR"
          make download -j"$(nproc)" || make download -j1 V=s \
            || echo "::warning::部分源码包下载失败，编译阶段会再次尝试"
          echo "清理小于 1KB 的无效下载文件："
          find dl -type f -size -1024c -print -delete 2>/dev/null || true
          du -sh dl 2>/dev/null || true

      # =======================================================================
      # 14. 按需编译工具链
      #     - 缓存命中：刷新 stamp 避免源码新时间戳触发重编，然后跳过
      #     - 全部未命中：编译并把结果写回缓存
      # =======================================================================
      - name: Build Toolchain
        id: toolchain
        run: |
          cd "$OPENWRT_DIR"
          CACHE_HIT="${{ steps.cache_restore.outputs.cache-hit }}"
          RELEASE_HIT="${{ steps.release_restore.outputs.restored }}"

          if [ "$CACHE_HIT" = "true" ] || [ "$RELEASE_HIT" = "true" ]; then
            echo "工具链已从缓存恢复，跳过编译"

            # 缓存里的 stamp 比新 clone 的源码旧，刷新它避免 make 判定工具链过期而重编
            find staging_dir -type d -name stamp -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done
            mkdir -p tmp && echo "1" > tmp/.build

            if [ "$CACHE_HIT" = "true" ]; then
              echo "need_save_cache=false" >> "$GITHUB_OUTPUT"
            else
              echo "need_save_cache=true" >> "$GITHUB_OUTPUT"
            fi
            echo "need_save_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "无可用缓存，开始编译 tools + toolchain（约 30~40 分钟）"
            make tools/install -j"$(nproc)" || make tools/install -j1 V=s
            make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s
            echo "need_save_cache=${{ inputs.OpenWrt_CACHE != 'false' }}" >> "$GITHUB_OUTPUT"
            echo "need_save_release=${{ inputs.OpenWrt_CACHE != 'false' }}" >> "$GITHUB_OUTPUT"
          fi

          # 与缓存方案配套：stamp 已在 staging_dir 里，让后续 make 不再要求重编工具链
          # shellcheck disable=SC2016  # sed 模式里的 $(...) 是 Makefile 语法，不展开
          sed -i 's/ $(tool.*\/stamp-compile)//' Makefile || true

      # =======================================================================
      # 15. 保存工具链到 actions/cache（Release 恢复后也会补写一次）
      # =======================================================================
      - name: Save Toolchain (actions/cache)
        if: inputs.OpenWrt_CACHE != 'false' && steps.toolchain.outputs.need_save_cache == 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*
          key: ${{ steps.cache_key.outputs.key }}

      # =======================================================================
      # 16. 保存工具链到 Release（actions/cache 有 10G 上限，Release 作长期备份）
      # =======================================================================
      - name: Save Toolchain (Release backup)
        if: inputs.OpenWrt_CACHE != 'false' && steps.toolchain.outputs.need_save_release == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$OPENWRT_DIR"
          KEY="${{ steps.cache_key.outputs.key }}"
          PREFIX="${{ steps.cache_key.outputs.prefix }}"

          tar -I zstdmt -cf "${KEY}.tzst" staging_dir/host* staging_dir/tool*
          ls -lh "${KEY}.tzst"

          if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create toolchain-cache --repo "$GITHUB_REPOSITORY" \
              --title "Toolchain Cache" \
              --notes "自动生成的工具链缓存，请勿手动删除" \
              --latest=false
          fi

          # 删掉同平台旧 Key 的备份，避免 Release 无限增长
          OLD_ASSETS="$(gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[].name' 2>/dev/null | grep "^${PREFIX}-" || true)"
          for old in $OLD_ASSETS; do
            echo "删除旧工具链备份: $old"
            gh release delete-asset toolchain-cache "$old" --repo "$GITHUB_REPOSITORY" -y || true
          done

          gh release upload toolchain-cache "${KEY}.tzst" --repo "$GITHUB_REPOSITORY" --clobber
          rm -f "${KEY}.tzst"
          echo "工具链已备份到 Release: $KEY.tzst"

      # =======================================================================
      # 17. 编译固件
      # =======================================================================
      - name: Compile Firmware
        run: |
          cd "$OPENWRT_DIR"
          echo "并行度: $(nproc)"
          mkdir -p "$GITHUB_WORKSPACE/build-reports"
          make -j"$(nproc)" BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" \
            || make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

          echo "======================="
          df -hT /
          du -sh bin/
          echo "======================="

      # =======================================================================
      # 18. 构建报告（失败时照样收集，方便定位耗时和工具链问题）
      # =======================================================================
      - name: Collect Build Reports
        if: always()
        continue-on-error: true
        run: |
          cd "$OPENWRT_DIR"
          "$GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh"

      - name: Upload Build Reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ env.OpenWrt_TARGET }}-${{ github.run_attempt }}
          path: build-reports/
          retention-days: 7
          if-no-files-found: ignore

      # =======================================================================
      # 19. 整理产物
      # =======================================================================
      - name: Package Firmware
        id: package
        run: |
          cd "$OPENWRT_DIR"
          UPLOAD="$GITHUB_WORKSPACE/upload"
          rm -rf "$UPLOAD" && mkdir -p "$UPLOAD"

          # 去掉不需要发布的 json / buildinfo / 各级 packages 目录
          rm -rf bin/targets/*/*/packages 2>/dev/null || true
          find bin/targets -type f \
            ! -name '*.json' ! -name '*.buildinfo' \
            -exec cp -f {} "$UPLOAD/" \;

          cp .config "$UPLOAD/Config_${OpenWrt_TARGET}_${OpenWrt_SOURCE}_${OpenWrt_DATE}.txt"

          ( cd "$UPLOAD" && find . -maxdepth 1 -type f ! -name 'sha256sums.txt' -printf '%P\0' \
              | sort -z | xargs -0 -r sha256sum > sha256sums.txt )

          echo "status=success" >> "$GITHUB_OUTPUT"
          find "$UPLOAD" -maxdepth 1 -type f -printf '%10s  %f\n' | sort -n | tail -n 30
          du -sh "$UPLOAD"

      # =======================================================================
      # 20. 上传 Artifact（临时保留，方便下载 bin 全量目录）
      # =======================================================================
      - name: Upload Artifact
        if: steps.package.outputs.status == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt_${{ env.OpenWrt_TARGET }}_${{ env.OpenWrt_DATE }}
          path: upload
          retention-days: 7
          if-no-files-found: warn

      # =======================================================================
      # 21. 发布 Release
      # =======================================================================
      - name: Release Firmware
        if: steps.package.outputs.status == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.OpenWrt_TARGET }}_${{ env.OpenWrt_SOURCE }}_${{ env.OpenWrt_DATE }}
          name: ${{ env.OpenWrt_TYPE }} · ${{ env.OpenWrt_DATE }}
          files: upload/*
          fail_on_unmatched_files: false
          body: |
            | 项目 | 详情 |
            | --- | --- |
            | 源码 | [${{ env.OpenWrt_SOURCE }}（${{ env.OpenWrt_BRANCH }}）](${{ env.OpenWrt_URL }}) |
            | 提交 | [`${{ env.OpenWrt_COMMIT }}`](${{ env.OpenWrt_COMMIT_URL }}) — ${{ env.OpenWrt_COMMIT_MSG }} |
            | 平台 | `${{ env.OpenWrt_TARGET }}` |
            | 设备 | ${{ env.OpenWrt_TYPE }} |
            | 密码 | ${{ env.OpenWrt_PW }} |
            | 地址 | ${{ env.OpenWrt_IP }} |
            | OpenClash | ${{ env.OpenWrt_OPENCLASH == 'true' && '已编译' || '未编译' }} |
            | Nikki | ${{ env.OpenWrt_NIKKI == 'true' && '已编译' || '未编译' }} |
            | 时间 | ${{ env.OpenWrt_DATE }}（Asia/Shanghai） |

            > 发布信息中的「提交」来自默认源码仓库 `${{ env.OpenWrt_URL }}`，非本 CI 仓库。
            > 刷机前请确认机型与分区，谨慎操作。

      # =======================================================================
      # 22. 清理旧 Release / tags / 工作流运行记录（各只保留最近 6 次）
      #     releases_keep_keyword 保证 toolchain-cache 永不被清理
      # =======================================================================
      - name: Delete releases and workflows runs
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_keyword: toolchain
          releases_keep_latest: 6
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 2
          gh_token: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 缓存轮转：actions/cache 有 10G 配额，只保留当前平台的最新一份工具链缓存
  # =========================================================================
  cache-rollover:
    name: Roll toolchain cache
    needs: openwrt_core
    if: ${{ success() && inputs.OpenWrt_CACHE != 'false' && needs.openwrt_core.outputs.cache_key != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CACHE_KEY: ${{ needs.openwrt_core.outputs.cache_key }}
      CACHE_PREFIX: ${{ needs.openwrt_core.outputs.cache_prefix }}
    steps:
      - name: Delete stale toolchain caches
        continue-on-error: true
        run: |
          set -euo pipefail
          CURRENT=$(gh cache list --repo "$GH_REPO" --key "$CACHE_KEY" --ref "$GITHUB_REF" \
            --limit 100 --json key --jq '.[].key' 2>/dev/null || true)
          if ! printf '%s\n' "$CURRENT" | grep -Fxq "$CACHE_KEY"; then
            echo "当前缓存尚未写入，跳过清理"
            exit 0
          fi
          gh cache list --repo "$GH_REPO" --key "$CACHE_PREFIX-" --ref "$GITHUB_REF" \
            --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' 2>/dev/null \
            | while IFS=$'\t' read -r id key; do
                [ -n "$id" ] || continue
                [ "$key" = "$CACHE_KEY" ] && continue
                echo "删除旧工具链缓存: $key"
                gh cache delete "$id" --repo "$GH_REPO" \
                  || echo "warning: 无法删除缓存 $key"
              done
